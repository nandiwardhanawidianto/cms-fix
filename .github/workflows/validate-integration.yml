name: Check CMS Form Review Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: find app routes config database -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Blade syntax via Laravel
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php artisan route:list
          php artisan view:cache
