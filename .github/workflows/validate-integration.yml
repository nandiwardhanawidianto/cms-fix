name: Check CMS Form Review Integration

on:
  push:
    branches: [main, feature/form-undangan-review-queue]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: find app routes config database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install Laravel
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list
          php artisan view:cache
      - name: Test Form Undangan API contract
        run: php artisan test --filter=FormSubmissionEndpointTest
